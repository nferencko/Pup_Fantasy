# Manual-only refresh of data/data.js (Actions tab > Run workflow). The daily update runs on the local PC instead,
# because the data sources block GitHub's servers; see update_scheduled.bat.
name: Update rankings data

on:
  # Scheduled runs are off: GitHub's servers get blocked by the data sources. The local Windows task
  # (update_scheduled.bat) updates and pushes data/data.js instead. This can still be run by hand.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch, validate and blend the sources
        run: python update_data.py

      - name: Commit the new data (if it changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.js
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "Update rankings data"; git push; fi

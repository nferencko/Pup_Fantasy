# Refreshes data/data.js every day starting at 9:00 AM Pacific and commits it, which updates the GitHub Pages site.
# GitHub cron runs in UTC, so two schedules are listed (9 AM PDT and 9 AM PST). Both always run: GitHub often
# starts scheduled jobs 1-2 hours late, so a "is it 9 AM yet" gate skipped the update. The second run of the day
# is harmless (it only commits when the data changed). Run it by hand any time from the Actions tab.
name: Update rankings data

on:
  schedule:
    - cron: "0 16 * * *"   # 9:00 AM Pacific Daylight Time
    - cron: "0 17 * * *"   # 9:00 AM Pacific Standard Time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch, validate and blend the sources
        run: python update_data.py

      - name: Commit the new data (if it changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.js
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "Update rankings data"; git push; fi
